[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newlibrary"
version = "0.1.0"
description = "Gerenciador pessoal de livros e revistas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
bib = "bib.cli:main"

[tool.setuptools.packages.find]
include = ["bib*"]
